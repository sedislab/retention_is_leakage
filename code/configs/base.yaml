# Base config. Every run config extends this via config.load(path, overrides). Per-dataset overrides
# live in configs/<dataset>.yaml (P1+); attack/DP-specific configs are separate files (attack_lira.yaml,
# dp.yaml) rather than nested here, so a shadow sweep doesn't need to know method internals.
seed: 0

stream:
  n_tasks: 10
  n_clients: 10
  beta: 0.5          # Dirichlet non-IID concentration; inf = IID
  domain_field: null # set to a column name for domain-incremental streams (Camelyon17)

method:
  name: M8_analytic_fcl
  n_classes: 100     # overridden per-dataset
  feature_dim: 768   # ViT-B/16 pooled feature dim
  ridge_lambda: 1.0
  prototype_momentum: 0.0
  release_counts: true

backbone: vit_base_patch16_224.augreg_in21k
